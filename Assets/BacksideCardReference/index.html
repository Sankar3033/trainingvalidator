<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trainings Provided</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow+Semi+Condensed:wght@600;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- ==========================================================
     ICON SPRITE  (single colour, inherits `color`)
========================================================== -->
<svg class="sprite" aria-hidden="true" focusable="false">

    <symbol id="i-electrical" viewBox="0 0 48 48">
        <path fill="currentColor" fill-rule="evenodd" d="M24 7c-6.4 0-11 5.2-11 12.6V29h22v-9.4C35 12.2 30.4 7 24 7Zm2.8 4.4L18.4 23.2h4.8L21 30.2l8.4-11.6h-4.8l2.2-7.2Z"/>
        <path fill="currentColor" d="M5 31.5h38a2 2 0 0 1 2 2V37a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-3.5a2 2 0 0 1 2-2Z"/>
    </symbol>

    <symbol id="i-crane" viewBox="0 0 48 48">
        <g fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 11h36"/>
            <path d="M13 42 24 11l11 31"/>
            <path d="M18 29h12M16 35h16"/>
            <path d="M9 42h30"/>
            <path d="M35 11v11"/>
            <path d="M31.5 22h7"/>
            <path d="M35 25v3M32.5 31.5a2.5 2.5 0 1 0 5 0"/>
        </g>
    </symbol>

    <symbol id="i-mhe" viewBox="0 0 48 48">
        <path fill="currentColor" d="M5 17h15a2 2 0 0 1 2 2v13H7a2 2 0 0 1-2-2V17Z"/>
        <g fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M7 17V7h14v10"/>
            <path d="M29 7v29M29 36h13"/>
            <path d="M22 25h7"/>
        </g>
        <circle cx="12" cy="37" r="5.5" fill="currentColor"/>
        <circle cx="25" cy="38" r="4.5" fill="currentColor"/>
    </symbol>

    <symbol id="i-height" viewBox="0 0 48 48">
        <path fill="currentColor" d="M17.5 11.4a4.5 4.5 0 0 1 9 0V13h-9v-1.6Z"/>
        <g fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 14.5v6.5"/>
            <path d="m22 16.8 8 3.4"/>
            <path d="M22 21l-3.6 6M22 21l3.6 6"/>
        </g>
        <path fill="currentColor" d="M8 27.5h32v3.6H8z"/>
        <g fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 31.1v11M36 31.1v11M12 31.1 36 42M36 31.1 12 42M9 42h30"/>
        </g>
    </symbol>

    <symbol id="i-dock" viewBox="0 0 48 48">
        <g fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 42V9a2 2 0 0 1 2-2h32a2 2 0 0 1 2 2v33"/>
        </g>
        <path fill="currentColor" d="M11 11h26v3.2H11zM11 17h26v3.2H11zM11 23h26v3.2H11z"/>
        <path fill="currentColor" d="M17 33.5c.6-2.6 1.6-4.5 3.4-4.5h7.2c1.8 0 2.8 1.9 3.4 4.5l1 3.5v3.5a1 1 0 0 1-1 1h-1.4a1 1 0 0 1-1-1V40H18.4v.5a1 1 0 0 1-1 1H16a1 1 0 0 1-1-1V37l2-3.5Z"/>
    </symbol>

    <symbol id="i-hv" viewBox="0 0 48 48">
        <g fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 42 24 6l10 36"/>
            <path d="M9 15h30M7 24h34"/>
            <path d="M19.5 24 24 15l4.5 9M17 33h14"/>
            <path d="M10 42h28"/>
            <path d="M12 15v4M36 15v4M9 24v4M39 24v4"/>
        </g>
    </symbol>

    <symbol id="i-fire" viewBox="0 0 48 48">
        <path fill="currentColor" d="M14 17h9a3 3 0 0 1 3 3v19a3 3 0 0 1-3 3h-9a3 3 0 0 1-3-3V20a3 3 0 0 1 3-3Z"/>
        <g fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M16 17v-4h5v4"/>
            <path d="M21 11h6l2.5 4.5"/>
        </g>
        <path fill="currentColor" d="M37 22c-3.4 3.3-5.5 5.9-5.5 9.4a5.5 5.5 0 0 0 11 0c0-3.9-2.8-6.4-5.5-9.4Z"/>
    </symbol>

    <symbol id="i-firstaid" viewBox="0 0 48 48">
        <g fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 15v-3a3 3 0 0 1 3-3h6a3 3 0 0 1 3 3v3"/>
        </g>
        <path fill="currentColor" fill-rule="evenodd" d="M10 15h28a4 4 0 0 1 4 4v18a4 4 0 0 1-4 4H10a4 4 0 0 1-4-4V19a4 4 0 0 1 4-4Zm16 6h-4v5h-5v4h5v5h4v-5h5v-4h-5v-5Z"/>
    </symbol>

    <symbol id="i-violation" viewBox="0 0 48 48">
        <path fill="currentColor" fill-rule="evenodd" d="M24 4 8 9.6v12.9C8 32.6 14.6 41 24 44c9.4-3 16-11.4 16-21.5V9.6L24 4Zm2 9h-4v15h4V13Zm0 18h-4v4h4v-4Z"/>
    </symbol>

</svg>

<!-- ==========================================================
     CARD
========================================================== -->
<div class="card">

    <!-- corner geometry -->
    <div class="corner tl" aria-hidden="true">
        <span class="c-dots"></span><span class="c1"></span><span class="c2"></span><span class="c3"></span>
    </div>
    <div class="corner bl" aria-hidden="true">
        <span class="c1"></span><span class="c-dots"></span><span class="c2"></span>
    </div>
    <div class="corner br" aria-hidden="true">
        <span class="c1"></span><span class="c2"></span><span class="c3"></span>
    </div>

    <div class="sheet">

        <!-- ---------- HEADER ---------- -->
        <header class="head">
            <h1 class="head-title">
                <span class="ink">Trainings</span>
                <span class="green">Provided</span>
            </h1>
            <div class="head-rule">
                <span class="line"></span>
                <span class="dot"></span>
                <span class="line"></span>
            </div>
        </header>

        <!-- ---------- TRAINING GRID ---------- -->
        <div class="grid">

            <div class="col">

                <label class="row">
                    <span class="tile"><svg><use href="#i-electrical"></use></svg></span>
                    <span class="row-label">Electrical Works</span>
                    <input class="check" type="checkbox" data-training="electrical-works">
                </label>

                <label class="row">
                    <span class="tile"><svg><use href="#i-crane"></use></svg></span>
                    <span class="row-label">A-Frame Crane</span>
                    <input class="check" type="checkbox" data-training="a-frame-crane">
                </label>

                <label class="row">
                    <span class="tile"><svg><use href="#i-mhe"></use></svg></span>
                    <span class="row-label">MHE / Machine Move</span>
                    <input class="check" type="checkbox" data-training="mhe-machine-move">
                </label>

                <label class="row">
                    <span class="tile"><svg><use href="#i-height"></use></svg></span>
                    <span class="row-label">Height Work</span>
                    <input class="check" type="checkbox" data-training="height-work">
                </label>

            </div>

            <div class="col-divider"></div>

            <div class="col">

                <label class="row">
                    <span class="tile"><svg><use href="#i-dock"></use></svg></span>
                    <span class="row-label">Dock Operations</span>
                    <input class="check" type="checkbox" data-training="dock-operations">
                </label>

                <label class="row">
                    <span class="tile"><svg><use href="#i-hv"></use></svg></span>
                    <span class="row-label">High Voltage (HV)</span>
                    <input class="check" type="checkbox" data-training="high-voltage">
                </label>

                <label class="row">
                    <span class="tile"><svg><use href="#i-fire"></use></svg></span>
                    <span class="row-label">Fire Fighting</span>
                    <input class="check" type="checkbox" data-training="fire-fighting">
                </label>

                <label class="row">
                    <span class="tile"><svg><use href="#i-firstaid"></use></svg></span>
                    <span class="row-label">First Aid</span>
                    <input class="check" type="checkbox" data-training="first-aid">
                </label>

            </div>

        </div>

        <!-- ---------- FOOTER ---------- -->
        <footer class="foot">

            <div class="violations">
                <svg class="violations-icon"><use href="#i-violation"></use></svg>
                <span class="violations-label">Safety Violations</span>
                <div class="violations-boxes">
                    <input class="check" type="checkbox" data-violation="1" aria-label="Safety violation 1">
                    <input class="check" type="checkbox" data-violation="2" aria-label="Safety violation 2">
                    <input class="check" type="checkbox" data-violation="3" aria-label="Safety violation 3">
                </div>
            </div>

            <img class="foot-logo" src="Assets/logo.png" alt="Schneider Electric">

        </footer>

    </div>

</div>

<script src="trainings.js"></script>

</body>
</html>
